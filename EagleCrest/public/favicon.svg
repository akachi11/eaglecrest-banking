<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1a14"/>
      <stop offset="1" stop-color="#0f0f0f"/>
    </linearGradient>
    <linearGradient id="gold" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6C977"/>
      <stop offset="1" stop-color="#C9A84C"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="48" height="48" rx="10" fill="url(#bg)"/>

  <!-- crest / shield -->
  <path d="M24 5 L40 11 V23 C40 33 33 40.5 24 44 C15 40.5 8 33 8 23 V11 Z"
        fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- eagle mark: stylized wings forming a peak -->
